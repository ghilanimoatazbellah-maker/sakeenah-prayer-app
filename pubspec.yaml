name: prayer_adhkar_app
description: "تطبيق مواقيت الصلاة والأذكار - سَكِينة"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6

  # Prayer times calculation & Qibla math
  adhan_dart: ^1.1.0

  # Hijri Calendar
  hijri: ^3.0.0

  # Location & Reverse Geocoding (City / State names)
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Local Notifications & Alarms
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Backend (streak / adhkar progress)
  supabase_flutter: ^2.5.6

  # Local storage for settings & custom adhkar
  shared_preferences: ^2.2.3

  # State management
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/icons/
